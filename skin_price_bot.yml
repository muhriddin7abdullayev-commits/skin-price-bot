name: Skin narxlarini tekshirish boti

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-messages:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'ni olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Botni ishga tushirish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.SKIN_BOT_TOKEN }}
        run: python skin_price_bot.py

      - name: offset.json holatini saqlash
        run: |
          git config user.name "skin-price-bot"
          git config user.email "actions@github.com"
          git add offset.json
          git diff --staged --quiet || git commit -m "offset.json yangilandi"
          git push
